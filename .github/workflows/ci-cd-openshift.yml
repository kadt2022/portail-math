name: Portail CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PORTAIL_APP_PORT: "8080"

concurrency:
  group: portail-ci-${{ github.ref }}
  # Les PR peuvent abandonner une validation obsolète. Sur main, le workflow
  # courant doit aller jusqu'au bout pour ne pas interrompre un déploiement.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Portail Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configurer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Node depuis .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Valider et configurer le Gradle Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Autoriser l'exécution du Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Vérifier Java, Node et Gradle
        shell: bash
        run: |
          set -euo pipefail
          expected_node_major="$(tr -d '[:space:]' < .nvmrc)"
          actual_node_major="$(node --print "process.versions.node.split('.')[0]")"

          if [[ "${actual_node_major}" != "${expected_node_major}" ]]; then
            echo "::error::Node ${expected_node_major} est requis, Node ${actual_node_major} est actif."
            exit 1
          fi

          java -version
          node --version
          npm --version
          ./gradlew help --no-daemon

      - name: Valider le verrou npm et la contrainte Node
        run: npm --prefix frontend ci --engine-strict

  assemble:
    name: Portail Assemble
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configurer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Node 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurer le cache Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Autoriser l'exécution du Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Construire l'application complète
        run: ./gradlew clean bootJar --no-daemon --build-cache

      - name: Vérifier le JAR exécutable unique
        id: executable-jar
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t jars < <(
            find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" -print0
          )

          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Un seul JAR exécutable était attendu, ${#jars[@]} trouvé(s)."
            printf 'JAR détecté : %s\n' "${jars[@]:-aucun}"
            exit 1
          fi

          sha256sum "${jars[0]}"
          echo "path=${jars[0]}" >> "${GITHUB_OUTPUT}"

      - name: Conserver le JAR de référence
        uses: actions/upload-artifact@v6
        with:
          name: portail-math-jar
          path: ${{ steps.executable-jar.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Conserver les sorties pour Sonar
        uses: actions/upload-artifact@v6
        with:
          name: portail-build-outputs
          path: |
            build/classes/**
            build/generated/**
            build/resources/**
          if-no-files-found: error
          retention-days: 7

  test-backend:
    name: Portail Tests - Backend
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Réutiliser les ressources assemblées
        uses: actions/download-artifact@v6
        with:
          name: portail-build-outputs
          path: build

      - uses: ./.github/actions/portail-test-group
        with:
          group: backend

  test-frontend:
    name: Portail Tests - Frontend
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/portail-test-group
        with:
          group: frontend

  test-games:
    name: Portail Tests - Jeux
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/portail-test-group
        with:
          group: games

  bvt:
    name: Portail BVT
    needs: [assemble, test-backend, test-frontend, test-games]
    runs-on: ubuntu-latest
    steps:
      - name: Configurer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Télécharger le JAR validé
        uses: actions/download-artifact@v6
        with:
          name: portail-math-jar
          path: build-artifacts

      - name: Démarrer le JAR de référence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t jars < <(
            find build-artifacts -type f -name "*.jar" ! -name "*-plain.jar" -print0
          )

          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Le BVT attend exactement un JAR, ${#jars[@]} trouvé(s)."
            exit 1
          fi

          sha256sum "${jars[0]}"
          PORT="${PORTAIL_APP_PORT}" java -jar "${jars[0]}" > app.log 2>&1 &
          echo "$!" > app.pid

      - name: Attendre la santé applicative
        shell: bash
        run: |
          set -euo pipefail
          health_file="${RUNNER_TEMP}/portail-health.json"

          for attempt in {1..45}; do
            status_code="$(
              curl --silent --show-error --connect-timeout 2 --max-time 5                 --output "${health_file}" --write-out '%{http_code}'                 "http://127.0.0.1:${PORTAIL_APP_PORT}/actuator/health" || true
            )"

            if [[ "${status_code}" == "200" ]] &&
              grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' "${health_file}"; then
              echo "Application saine à la tentative ${attempt}."
              exit 0
            fi
            sleep 2
          done

          echo "::error::L'application n'a pas atteint l'état UP."
          cat app.log
          exit 1

      - name: Vérifier les routes essentielles
        shell: bash
        run: |
          set -euo pipefail
          base_url="http://127.0.0.1:${PORTAIL_APP_PORT}"
          routes=(
            "/"
            "/app/"
            "/games/multiplication-train.html"
            "/games/fraction-river.html"
            "/api/v1/exetat/matieres"
          )

          for route in "${routes[@]}"; do
            status_code="$(
              curl --silent --show-error --location --connect-timeout 2 --max-time 10                 --output /dev/null --write-out '%{http_code}' "${base_url}${route}"
            )"

            if [[ "${status_code}" != "200" ]]; then
              echo "::error::${route} a répondu HTTP ${status_code}, 200 attendu."
              exit 1
            fi
            echo "${route} répond HTTP 200."
          done

      - name: Afficher les journaux en cas d'échec
        if: ${{ failure() }}
        run: cat app.log

      - name: Conserver le journal BVT
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: portail-bvt-log
          path: app.log
          if-no-files-found: warn
          retention-days: 7

      - name: Arrêter l'application
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f app.pid ]]; then
            kill "$(cat app.pid)" || true
          fi

  sonar:
    name: Portail Sonar Analysis
    needs: bvt
    if: >-
      needs.bvt.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer le cache Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Autoriser l'exécution du Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Télécharger les classes assemblées
        uses: actions/download-artifact@v6
        with:
          name: portail-build-outputs
          path: build

      - name: Télécharger les résultats backend
        uses: actions/download-artifact@v6
        with:
          name: portail-test-results-backend
          path: build

      - name: Télécharger les résultats frontend
        uses: actions/download-artifact@v6
        with:
          name: portail-test-results-frontend
          path: build

      - name: Exécuter l'analyse Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sonar_host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"

          if [[ -z "${SONAR_TOKEN:-}" || -z "${SONAR_PROJECT_KEY:-}" ]]; then
            echo "::error::SONAR_TOKEN et SONAR_PROJECT_KEY sont requis."
            exit 1
          fi

          if [[ ! -f build/reports/jacoco/test/jacocoTestReport.xml ]]; then
            echo "::error::Le rapport JaCoCo backend est introuvable."
            exit 1
          fi

          if [[ ! -f build/reports/coverage/frontend/lcov.info ]]; then
            echo "::error::Le rapport de couverture frontend (lcov) est introuvable."
            exit 1
          fi

          args=(
            sonar
            --no-daemon
            "-Dsonar.gradle.skipCompile=true"
            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}"
            "-Dsonar.host.url=${sonar_host_url}"
          )
          if [[ -n "${SONAR_ORGANIZATION:-}" ]]; then
            args+=("-Dsonar.organization=${SONAR_ORGANIZATION}")
          fi

          ./gradlew "${args[@]}"

          if [[ ! -f build/sonar/report-task.txt ]]; then
            echo "::error::Les métadonnées de l'analyse Sonar sont introuvables."
            exit 1
          fi

      - name: Conserver les métadonnées Sonar
        uses: actions/upload-artifact@v6
        with:
          name: portail-sonar-metadata
          path: build/sonar/report-task.txt
          if-no-files-found: error
          retention-days: 1

  quality-gate:
    name: Portail Quality Gate
    needs: sonar
    if: >-
      needs.sonar.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger les métadonnées Sonar
        uses: actions/download-artifact@v6
        with:
          name: portail-sonar-metadata
          path: build/sonar

      - name: Attendre et vérifier le Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="build/sonar/report-task.txt"

          if [[ -z "${SONAR_TOKEN:-}" || ! -f "${metadata_file}" ]]; then
            echo "::error::Le jeton ou les métadonnées Sonar sont absents."
            exit 1
          fi

          ce_task_url="$(sed -n 's/^ceTaskUrl=//p' "${metadata_file}" | tail -n 1)"
          if [[ -z "${ce_task_url}" ]]; then
            echo "::error::ceTaskUrl est absent des métadonnées Sonar."
            exit 1
          fi

          ce_status=""
          analysis_id=""
          for attempt in {1..60}; do
            curl -fsS -u "${SONAR_TOKEN}:" "${ce_task_url}" > sonar-ce-task.json
            ce_status="$(jq -r '.task.status // empty' sonar-ce-task.json)"

            case "${ce_status}" in
              SUCCESS)
                analysis_id="$(jq -r '.task.analysisId // empty' sonar-ce-task.json)"
                break
                ;;
              FAILED|CANCELED)
                echo "::error::Le calcul Sonar s'est terminé avec le statut ${ce_status}."
                jq . sonar-ce-task.json
                exit 1
                ;;
              PENDING|IN_PROGRESS)
                sleep 5
                ;;
              *)
                echo "::error::Statut Sonar inattendu : ${ce_status:-vide}."
                jq . sonar-ce-task.json
                exit 1
                ;;
            esac
          done

          if [[ "${ce_status}" != "SUCCESS" || -z "${analysis_id}" ]]; then
            echo "::error::Le calcul Sonar n'a pas abouti dans le délai imparti."
            exit 1
          fi

          server_url="${ce_task_url%%/api/ce/task*}"
          curl -fsS -u "${SONAR_TOKEN}:" \
            "${server_url}/api/qualitygates/project_status?analysisId=${analysis_id}" \
            > portail-quality-gate-report.json

          quality_status="$(jq -r '.projectStatus.status // empty' portail-quality-gate-report.json)"
          {
            echo "## Portail Quality Gate"
            echo
            echo "- Statut Sonar : **${quality_status:-INCONNU}**"
            jq -r '.projectStatus.conditions[]? | "- " + .metricKey + ": " + .status' \
              portail-quality-gate-report.json
          } >> "${GITHUB_STEP_SUMMARY}"

          jq . portail-quality-gate-report.json
          if [[ "${quality_status}" != "OK" ]]; then
            echo "::error::Le Quality Gate Sonar est ${quality_status:-INCONNU}."
            exit 1
          fi

      - name: Conserver le rapport Quality Gate
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: portail-quality-gate-report
          path: |
            portail-quality-gate-report.json
            sonar-ce-task.json
          if-no-files-found: warn
          retention-days: 7

  status-check:
    name: Portail CI Status
    needs: [preflight, assemble, test-backend, test-frontend, test-games, bvt, sonar, quality-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SONAR_REQUIRED: >-
        ${{ github.event_name != 'pull_request' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
             github.event.pull_request.user.login != 'dependabot[bot]') }}
    steps:
      - name: Synthétiser les jobs obligatoires
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          check_result() {
            local job="$1"
            local result="$2"
            if [[ "${result}" == "success" ]]; then
              echo "${job}: ${result}"
            else
              echo "::error::${job}: ${result}"
              failed=1
            fi
          }

          check_sonar_result() {
            local job="$1"
            local result="$2"
            if [[ "${result}" == "success" ]]; then
              echo "${job}: ${result}"
            elif [[ "${SONAR_REQUIRED}" != "true" && "${result}" == "skipped" ]]; then
              echo "${job}: skipped (secrets indisponibles pour cette PR)"
            else
              echo "::error::${job}: ${result}"
              failed=1
            fi
          }

          check_result preflight "${{ needs.preflight.result }}"
          check_result assemble "${{ needs.assemble.result }}"
          check_result test-backend "${{ needs['test-backend'].result }}"
          check_result test-frontend "${{ needs['test-frontend'].result }}"
          check_result test-games "${{ needs['test-games'].result }}"
          check_result bvt "${{ needs.bvt.result }}"
          check_sonar_result sonar "${{ needs.sonar.result }}"
          check_sonar_result quality-gate "${{ needs['quality-gate'].result }}"

          if [[ "${failed}" -ne 0 ]]; then
            echo "Portail CI status: FAILED"
            exit 1
          fi
          echo "Portail CI status: PASSED"

  deploy-openshift:
    name: Déploiement OpenShift dev
    needs: status-check
    if: >-
      github.ref == 'refs/heads/main' &&
      needs['status-check'].result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: openshift-dev
    concurrency:
      group: portail-math-openshift-dev
      cancel-in-progress: true
    env:
      OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
      OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
      OPENSHIFT_ROUTE_HOST: ${{ vars.OPENSHIFT_ROUTE_HOST }}

    steps:
      - name: Récupérer les manifestes
        uses: actions/checkout@v6

      - name: Télécharger le JAR validé par la CI
        uses: actions/download-artifact@v6
        with:
          name: portail-math-jar
          path: downloaded-jar

      - name: Préparer le contexte de build binaire
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t jars < <(
            find downloaded-jar -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" -print0
          )

          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::L'artefact doit contenir exactement un JAR exécutable, ${#jars[@]} trouvé(s)."
            exit 1
          fi

          mkdir -p .openshift-build
          cp "${jars[0]}" .openshift-build/app.jar
          sha256sum .openshift-build/app.jar

      - name: Vérifier la configuration de l'environnement
        shell: bash
        run: |
          set -euo pipefail
          for variable in OPENSHIFT_SERVER OPENSHIFT_NAMESPACE OPENSHIFT_ROUTE_HOST; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::La variable GitHub ${variable} est absente de l'environnement openshift-dev."
              exit 1
            fi
          done

      - name: Installer le client OpenShift
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Se connecter au projet OpenShift
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENSHIFT_TOKEN:-}" ]]; then
            echo "::error::Le secret OPENSHIFT_TOKEN est absent de l'environnement openshift-dev."
            exit 1
          fi

          oc login "${OPENSHIFT_SERVER}" --token="${OPENSHIFT_TOKEN}"
          oc project "${OPENSHIFT_NAMESPACE}"

      - name: Produire les manifestes propres à l'environnement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rendered-openshift
          envsubst '${OPENSHIFT_NAMESPACE}' < openshift/deployment.yml > .rendered-openshift/deployment.yml
          envsubst '${OPENSHIFT_ROUTE_HOST}' < openshift/route.yml > .rendered-openshift/route.yml

          if grep -RF '${OPENSHIFT_' .rendered-openshift; then
            echo "::error::Un placeholder OpenShift n'a pas été remplacé."
            exit 1
          fi

      - name: Appliquer les manifestes OpenShift
        shell: bash
        run: |
          set -euo pipefail
          oc apply -f openshift/imagestream.yml
          oc apply -f openshift/buildconfig.yml
          oc apply -f openshift/service.yml
          oc apply -f .rendered-openshift/deployment.yml
          oc apply -f .rendered-openshift/route.yml

      - name: Construire l'image depuis le JAR validé
        shell: bash
        run: |
          set -euo pipefail
          oc start-build portail-math \
            --from-dir=.openshift-build \
            --follow \
            --wait | tee "${RUNNER_TEMP}/portail-math-build.log"

          build_name="$(
            oc get builds \
              -l buildconfig=portail-math \
              --sort-by=.metadata.creationTimestamp \
              -o name | tail -n 1
          )"

          if [[ -z "${build_name}" ]]; then
            echo "::error::Le nom du build OpenShift est introuvable."
            exit 1
          fi
          echo "Build OpenShift terminé : ${build_name}"

      - name: Déployer la nouvelle image
        shell: bash
        run: |
          set -euo pipefail
          oc rollout restart deployment/portail-math
          oc rollout status deployment/portail-math --timeout=300s

      - name: Afficher l'état des ressources
        shell: bash
        run: |
          set -euo pipefail
          oc get deployment portail-math
          oc get pods -l app=portail-math
          oc get service portail-math
          oc get route portail

      - name: Vérifier la santé applicative
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://${OPENSHIFT_ROUTE_HOST}"
          health_file="${RUNNER_TEMP}/portail-math-health.json"
          healthy=false

          for attempt in {1..12}; do
            status_code="$(
              curl --silent --show-error --location --connect-timeout 10 --max-time 20                 --output "${health_file}" --write-out '%{http_code}'                 "${base_url}/actuator/health" || true
            )"

            if [[ "${status_code}" == "200" ]] &&
              grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' "${health_file}"; then
              healthy=true
              echo "Santé applicative confirmée à la tentative ${attempt}."
              break
            fi
            echo "Santé non disponible (tentative ${attempt}/12, HTTP ${status_code:-000})."
            sleep 10
          done

          if [[ "${healthy}" != "true" ]]; then
            echo "::error::L'application n'a pas atteint l'état UP après 12 tentatives."
            [[ -f "${health_file}" ]] && cat "${health_file}"
            exit 1
          fi

      - name: Vérifier les pages publiques essentielles
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://${OPENSHIFT_ROUTE_HOST}"

          for path in "/" "/exetat"; do
            status_code="$(
              curl --silent --show-error --location --connect-timeout 10 --max-time 20                 --output /dev/null --write-out '%{http_code}' "${base_url}${path}"
            )"

            if [[ "${status_code}" != "200" ]]; then
              echo "::error::${path} a répondu avec le statut HTTP ${status_code}, 200 attendu."
              exit 1
            fi
            echo "${path} répond HTTP 200."
          done
