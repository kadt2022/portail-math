<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Mbuyamba Math · Apprentissage interactif</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f6f7fb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Le lanceur est servi par Spring à la racine du même JAR. Une insertion
      // précoce le charge avant le bundle React sans demander à Vite de le
      // résoudre dans le dossier frontend.
      const gameLauncher = document.createElement("script");
      gameLauncher.src = "/js/fraction-river-launch.js";
      gameLauncher.async = false;
      document.head.appendChild(gameLauncher);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
