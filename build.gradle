plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '7.3.0.8198'
}

group = 'cd.portailmath'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

// ---------------------------------------------------------------------------
// Portail React (frontend/). Il est construit par le même build Gradle et
// empaqueté dans le même JAR : un seul artefact, un seul déploiement OpenShift.
// ---------------------------------------------------------------------------

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npmExecutable = isWindows ? 'npm.cmd' : 'npm'
def npxExecutable = isWindows ? 'npx.cmd' : 'npx'
def frontendDir = file('frontend')

tasks.register('frontendInstall', Exec) {
    description = 'Installe les dépendances du portail React à partir du verrou.'
    workingDir frontendDir
    // npm ci et non npm install : l'installation doit être reproductible et
    // refuser toute dérive par rapport à package-lock.json.
    commandLine npmExecutable, 'ci'
    inputs.file(new File(frontendDir, 'package.json'))
    inputs.file(new File(frontendDir, 'package-lock.json'))
    outputs.dir(new File(frontendDir, 'node_modules'))
}

tasks.register('frontendLint', Exec) {
    description = 'Analyse statique du portail React.'
    dependsOn 'frontendInstall'
    workingDir frontendDir
    commandLine npmExecutable, 'run', 'lint'
}

tasks.register('frontendTest', Exec) {
    description = 'Tests du portail React, avec couverture pour Sonar.'
    dependsOn 'frontendInstall'
    workingDir frontendDir
    // Écrit sous build/reports/coverage/frontend (voir vite.config.ts) :
    // même arbre que le rapport JaCoCo du backend, pour que la CI télécharge
    // et publie les deux avec le même artefact "sous build/".
    commandLine npmExecutable, 'run', 'test', '--', '--coverage'
    doLast {
        // vitest écrit des chemins SF relatifs à frontend/ (son propre cwd),
        // mais le sensor JS/TS de Sonar les résout depuis la racine du
        // projet (là où sonar.sources déclare "frontend/src") : sans ce
        // préfixe, aucun fichier ne correspond et la couverture reste à 0 %.
        def lcovFile = file("${rootDir}/build/reports/coverage/frontend/lcov.info")
        if (lcovFile.exists()) {
            def rewritten = lcovFile.readLines().collect { line ->
                line.startsWith('SF:') ? "SF:frontend/${line.substring(3).replace('\\', '/')}" : line
            }.join(System.lineSeparator())
            lcovFile.text = rewritten + System.lineSeparator()
        }
    }
}

tasks.register('frontendBuild', Exec) {
    description = 'Construit le portail React vers frontend/dist.'
    dependsOn 'frontendInstall'
    workingDir frontendDir
    commandLine npmExecutable, 'run', 'build'
    inputs.dir(new File(frontendDir, 'src'))
    inputs.file(new File(frontendDir, 'index.html'))
    inputs.file(new File(frontendDir, 'vite.config.ts'))
    inputs.file(new File(frontendDir, 'tsconfig.json'))
    outputs.dir(new File(frontendDir, 'dist'))
}

tasks.named('processResources') {
    dependsOn 'frontendBuild'
    // Les fichiers produits par Vite deviennent des ressources statiques du JAR.
    from(new File(frontendDir, 'dist')) {
        into 'static/app'
    }
}

tasks.register('testProgressStore', Exec) {
    commandLine 'node', 'src/test/js/progress-store.test.js'
}

tasks.register('testMultiplicationTrain', Exec) {
    commandLine 'node', 'src/test/js/multiplication-train.test.js'
}

tasks.register('testFractionRiver', Exec) {
    commandLine 'node', 'src/test/js/fraction-river.test.js'
}

tasks.register('testFractionRiverAnchors', Exec) {
    commandLine 'node', 'src/test/js/fraction-river-anchors.test.js'
}

tasks.register('testGameI18n', Exec) {
    commandLine 'node', 'src/test/js/game-i18n.test.js'
}

tasks.register('testGameShellI18n', Exec) {
    commandLine 'node', 'src/test/js/game-shell-i18n.test.js'
}

// Les tests ci-dessus (node direct) n'ont pas de couverture : ce jeu de jeux
// n'a jamais fait remonter de couverture JS à Sonar. c8 (V8 coverage, aucune
// instrumentation de build nécessaire) rejoue la même suite groupée pour
// produire un rapport lcov, au même endroit "sous build/" que le reste (voir
// frontendTest pour le même principe côté frontend React).
tasks.register('testGamesCoverage', Exec) {
    description = 'Rejoue les tests des jeux sous c8 pour la couverture Sonar.'
    commandLine npxExecutable, '--yes', 'c8@10',
        '--reporter=lcov',
        '--report-dir=build/reports/coverage/games',
        '--include=src/main/resources/static/js/**',
        'node', 'src/test/js/run-all-games-tests.js'
    doLast {
        def lcovFile = file("${rootDir}/build/reports/coverage/games/lcov.info")
        if (lcovFile.exists()) {
            def rewritten = lcovFile.readLines().collect { line ->
                line.startsWith('SF:') ? "SF:${line.substring(3).replace('\\', '/')}" : line
            }.join(System.lineSeparator())
            lcovFile.text = rewritten + System.lineSeparator()
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// `test` reste la suite backend Java/Spring. `check` demeure la validation
// locale complète, tandis que la CI peut lancer les trois groupes en parallèle
// sans rejouer les suites frontend et jeux dans le job backend.
tasks.named('check') {
    dependsOn tasks.named('testProgressStore')
    dependsOn tasks.named('testMultiplicationTrain')
    dependsOn tasks.named('testFractionRiver')
    dependsOn tasks.named('frontendLint')
    dependsOn tasks.named('frontendTest')
    dependsOn tasks.named('testFractionRiverAnchors')
    dependsOn tasks.named('testGameI18n')
    dependsOn tasks.named('testGameShellI18n')
    dependsOn tasks.named('testGamesCoverage')
}

sonar {
    properties {
        property 'sonar.projectName', 'Portail éducatif'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.sources', 'src/main/java,src/main/resources/static/js,frontend/src'
        property 'sonar.tests', 'src/test/java,src/test/js'
        property 'sonar.exclusions', [
            'frontend/src/**/*.test.ts',
            'frontend/src/**/*.test.tsx',
            'frontend/node_modules/**',
            'frontend/dist/**',
            'build/**'
        ].join(',')
        // Les dictionnaires de traduction (fr/en, mêmes clés, valeurs
        // différentes) déclenchent des faux positifs de duplication : un
        // détecteur de copier-coller normalise les littéraux de chaîne, donc
        // deux blocs "clé: chaîne," de même forme mais de contenu différent
        // se ressemblent structurellement. Cible uniquement la détection de
        // duplication (les fichiers restent analysés pour tout le reste :
        // couverture, bugs, failles).
        property 'sonar.cpd.exclusions', [
            'src/main/resources/static/js/game-shell-i18n.js',
            'src/main/resources/static/js/fraction-river-i18n.js',
            'src/main/resources/static/js/multiplication-train-i18n.js'
        ].join(',')
        property 'sonar.java.binaries', 'build/classes/java/main'
        property 'sonar.java.test.binaries', 'build/classes/java/test'
        property 'sonar.junit.reportPaths', 'build/test-results/test'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.javascript.lcov.reportPaths',
            'build/reports/coverage/frontend/lcov.info,build/reports/coverage/games/lcov.info'
        property 'sonar.typescript.lcov.reportPaths',
            'build/reports/coverage/frontend/lcov.info,build/reports/coverage/games/lcov.info'
    }
}
