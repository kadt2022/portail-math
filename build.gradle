plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cd.portailmath'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.register('testProgressStore', Exec) {
    commandLine 'node', 'src/test/js/progress-store.test.js'
}

tasks.register('testMultiplicationTrain', Exec) {
    commandLine 'node', 'src/test/js/multiplication-train.test.js'
}

tasks.register('testFractionRiver', Exec) {
    commandLine 'node', 'src/test/js/fraction-river.test.js'
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn tasks.named('testProgressStore')
    dependsOn tasks.named('testMultiplicationTrain')
    dependsOn tasks.named('testFractionRiver')
}
